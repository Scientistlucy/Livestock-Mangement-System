<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f0f5f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        .forms-container {
            position: relative;
        }

        .form-section {
            transition: all 0.3s ease;
        }

        .form-section.hidden {
            display: none;
        }

        h1 {
            color: #2f855a;
            margin-bottom: 30px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-icon {
            position: absolute;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
            color: #48bb78;
            z-index: 1;
            font-size: 16px;
            pointer-events: none;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2d3748;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px 12px 12px 35px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: #48bb78;
            outline: none;
            box-shadow: 0 0 0 3px rgba(72, 187, 120, 0.2);
        }

        .password-requirements {
            font-size: 12px;
            color: #718096;
            margin-top: 5px;
        }

        .terms-container {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .terms-container input[type="checkbox"] {
            width: auto;
            padding: 0;
        }

        button {
            background: #2f855a;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        button:hover {
            background: #38a169;
        }

        .switch-form {
            text-align: center;
            margin-top: 20px;
            color: #4a5568;
        }

        .switch-form a {
            color: #2f855a;
            text-decoration: none;
            font-weight: 500;
            margin-left: 5px;
        }

        .switch-form a:hover {
            text-decoration: underline;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: #2f855a;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #e53e3e;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="forms-container">
            <!-- Login Form -->
            <div class="form-section" id="loginForm">
                <h1>Farmer Login</h1>
                <div class="error-message" id="errorMessage" style="display: none;">
                    Authentication failed. Please try again.
                </div>
                <form id="loginForm" onsubmit="return handleLogin(event)">
                    <div class="input-group">
                        <label>Email Address<span class="required">*</span></label>
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" name="email" placeholder="Enter your email address" required>
                    </div>

                    <div class="input-group">
                        <label>Password<span class="required">*</span></label>
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" name="password" placeholder="Enter your password" required>
                    </div>

                    <div class="forgot-password">
                        <a href="#">Forgot Password?</a>
                    </div>

                    <button type="submit">Login</button>
                    
                    <div class="switch-form">
                        Don't have an account? <a href="registration.html">Register here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();

            // Example of simple authentication check
            const email = event.target.email.value;
            const password = event.target.password.value;

            // Simple check for demonstration purposes
            if (email !== "farmer@example.com" || password !== "password123") {
                document.getElementById('errorMessage').style.display = 'block';
            } else {
                alert('Login successful');
                document.getElementById('errorMessage').style.display = 'none';
                // You can redirect to another page here
            }
        }
    </script>
</body>
</html>
