<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Vaccination Statistics</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f5f5f5;
            padding: 20px;
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-title {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.2em;
            position: relative;
        }

        /* Enhanced Vaccination Grid */
        .vaccination-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #e0e0e0;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: #28a745;
            transition: all 0.3s ease;
        }

        .stat-card:nth-child(2)::before {
            background: #ffc107;
        }

        .stat-card:nth-child(3)::before {
            background: #dc3545;
        }

        .stat-card:nth-child(4)::before {
            background: #17a2b8;
        }

        .stat-icon {
            font-size: 32px;
            margin-bottom: 15px;
            height: 70px;
            width: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(40, 167, 69, 0.1);
            margin-bottom: 20px;
        }

        .stat-card:nth-child(2) .stat-icon {
            background: rgba(255, 193, 7, 0.1);
        }

        .stat-card:nth-child(3) .stat-icon {
            background: rgba(220, 53, 69, 0.1);
        }

        .stat-card:nth-child(4) .stat-icon {
            background: rgba(23, 162, 184, 0.1);
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #2c3e50;
            margin: 10px 0;
            position: relative;
            display: inline-block;
        }

        .stat-number::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 3px;
            background: #28a745;
            border-radius: 3px;
        }

        .stat-card:nth-child(2) .stat-number::after {
            background: #ffc107;
        }

        .stat-card:nth-child(3) .stat-number::after {
            background: #dc3545;
        }

        .stat-card:nth-child(4) .stat-number::after {
            background: #17a2b8;
        }

        .stat-label {
            color: #6c757d;
            font-size: 1em;
            font-weight: 500;
            margin-top: 15px;
        }

        .progress-info {
            width: 100%;
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            color: #6c757d;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-value {
            height: 100%;
            background: #28a745;
            border-radius: 4px;
        }

        .stat-card:nth-child(2) .progress-value {
            background: #ffc107;
        }

        .stat-card:nth-child(3) .progress-value {
            background: #dc3545;
        }

        .stat-card:nth-child(4) .progress-value {
            background: #17a2b8;
        }

        /* Additional card for today's scheduled vaccinations */
        .stat-card.today {
            grid-column: span 3;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            padding: 20px 30px;
        }

        .today-info {
            display: flex;
            flex-direction: column;
        }

        .today-label {
            font-size: 1.2em;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .today-count {
            font-size: 2.2em;
            font-weight: bold;
            color: #17a2b8;
        }

        .today-icon {
            font-size: 40px;
            color: #17a2b8;
        }

        .action-button {
            padding: 12px 24px;
            background: #17a2b8;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .action-button:hover {
            background: #138496;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(23, 162, 184, 0.3);
        }

        @media (max-width: 768px) {
            .vaccination-grid {
                grid-template-columns: 1fr;
            }

            .stat-card.today {
                grid-column: span 1;
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }

            .today-info {
                align-items: center;
            }

            .stat-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="page-title">Vaccination Dashboard</h1>
        
        <!-- Enhanced Statistics Cards -->
        <div class="vaccination-grid">
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-syringe" style="color: #28a745;"></i>
                </div>
                <div class="stat-number">45</div>
                <div class="stat-label">Total Vaccinations</div>
                <div class="progress-info">
                    <span>Weekly goal: 60</span>
                    <span>75%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-value" style="width: 75%;"></div>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-clock" style="color: #ffc107;"></i>
                </div>
                <div class="stat-number">12</div>
                <div class="stat-label">Pending Vaccinations</div>
                <div class="progress-info">
                    <span>Last week: 18</span>
                    <span>-33%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-value" style="width: 33%;"></div>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-exclamation-triangle" style="color: #dc3545;"></i>
                </div>
                <div class="stat-number">8</div>
                <div class="stat-label">Overdue Vaccinations</div>
                <div class="progress-info">
                    <span>Critical: 3</span>
                    <span>Needs attention</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-value" style="width: 37.5%;"></div>
                </div>
            </div>
            
            <!-- Added "Today's Scheduled" card spanning full width -->
            <div class="stat-card today">
                <div class="today-info">
                    <div class="today-label">Today's Scheduled Vaccinations</div>
                    <div class="today-count">5</div>
                </div>
                <div class="today-icon">
                    <i class="fas fa-calendar-day"></i>
                </div>
                <button class="action-button">
                    <i class="fas fa-eye"></i>
                    View Schedule
                </button>
            </div>
        </div>
    </div>
