<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f0f5f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            color: #2f855a;
            margin-bottom: 30px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-icon {
            position: absolute;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
            color: #48bb78;
            z-index: 1;
            font-size: 16px;
            pointer-events: none;
        }

        input, select {
            width: 100%;
            padding: 12px 12px 12px 35px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: #48bb78;
            outline: none;
            box-shadow: 0 0 0 3px rgba(72, 187, 120, 0.2);
        }

        button {
            background: #2f855a;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .required {
            color: #e53e3e;
            margin-left: 3px;
        }

        .loading-message, .success-message {
            display: none;
            text-align: center;
            color: #2f855a;
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="forms-container">
            <div class="form-section" id="registerForm">
                <h1>Farmer Registration</h1>
                <form id="registrationForm">
                    <div class="input-group">
                        <label>Full Name<span class="required">*</span></label>
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" name="full_name" placeholder="Enter your full name" required>
                    </div>
                    <div class="input-group">
                        <label>Phone Number<span class="required">*</span></label>
                        <i class="fas fa-phone input-icon"></i>
                        <input type="tel" name="phone_number" placeholder="Enter your phone number" required>
                    </div>

                    <div class="input-group">
                        <label>Email Address<span class="required">*</span></label>
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" name="email" placeholder="Enter your email address" required>
                    </div>

                    <div class="input-group">
                        <label>Password<span class="required">*</span></label>
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" name="password" placeholder="Create a strong password" required>
                    </div>

                    <div class="input-group">
                        <label>Confirm Password<span class="required">*</span></label>
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" name="confirm_password" placeholder="Confirm your password" required>
                    </div>

                    <button type="submit">Create Account</button>
                </form>

                <div class="loading-message" id="loadingMessage">
                    Loading... Please wait.
                </div>
                <div class="success-message" id="successMessage">
                    Successfully registered! Redirecting to login page...
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', function(event) {
            event.preventDefault();

            // Show loading message
            document.getElementById('loadingMessage').style.display = 'block';

            // Simulate a delay (e.g., waiting for server response)
            setTimeout(function() {
                // Hide loading message
                document.getElementById('loadingMessage').style.display = 'none';

                // Show success message
                document.getElementById('successMessage').style.display = 'block';

                // Redirect to login page after 2 seconds
                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 2000);
            }, 1500); // Simulate a 1.5-second loading time
        });
    </script>
</body>
</html>
